<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Anne, the card-table host">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1712"/>
      <stop offset=".45" stop-color="#4b2a20"/>
      <stop offset="1" stop-color="#1a0e0b"/>
    </linearGradient>
    <linearGradient id="skin" x1=".2" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#e6b58d"/>
      <stop offset=".45" stop-color="#cf9368"/>
      <stop offset="1" stop-color="#a96c49"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2815a" stop-opacity="0"/>
      <stop offset="1" stop-color="#8e5338" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="emerald" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#1f6d53"/>
      <stop offset=".5" stop-color="#0e4a39"/>
      <stop offset="1" stop-color="#062a21"/>
    </linearGradient>
    <linearGradient id="emeraldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d8a69"/>
      <stop offset="1" stop-color="#11513e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dea0"/>
      <stop offset=".45" stop-color="#d0aa5e"/>
      <stop offset="1" stop-color="#8d6a2d"/>
    </linearGradient>
    <linearGradient id="lips" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8585c"/>
      <stop offset="1" stop-color="#7d303a"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c76c5f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#c76c5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="#d0aa5e" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#0e4a39" stop-opacity=".08"/>
      <stop offset="1" stop-color="#062a21" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="portrait">
      <path d="M0 0h420v520H0z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#portrait)">
    <rect width="420" height="520" fill="#0b2a21"/>
    <ellipse cx="210" cy="218" rx="235" ry="230" fill="url(#halo)"/>
    <path d="M18 520c8-93 64-145 148-165l88 1c86 20 142 72 150 164z" fill="url(#emerald)"/>
    <path d="M110 520c5-76 47-119 100-130l28 78 26-78c54 13 94 55 99 130z" fill="url(#emeraldLight)" opacity=".5"/>
    <path d="M158 365c18 14 34 22 52 22s35-8 53-22l-8 62c-14 13-28 19-45 19s-31-6-45-19z" fill="#0a392b"/>
