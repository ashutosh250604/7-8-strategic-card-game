    <path d="M148 168c9-44 39-67 76-67 42 0 70 26 73 74l-3 72c-2 32-15 56-35 68-15 9-30 13-44 11-30-3-52-24-60-59-4-19-6-40-7-63z" fill="url(#skin)"/>
    <path d="M148 168c9-44 39-67 76-67 42 0 70 26 73 74l-3 72c-2 32-15 56-35 68-15 9-30 13-44 11-30-3-52-24-60-59-4-19-6-40-7-63z" fill="url(#skinShade)" opacity=".55"/>
    <ellipse cx="166" cy="241" rx="28" ry="22" fill="url(#cheek)"/>
    <ellipse cx="256" cy="243" rx="26" ry="20" fill="url(#cheek)"/>

