    <path d="M118 210c-10-78 26-139 92-149 69-10 121 42 117 116-2 44-11 80-30 110 5 30 14 55 30 76-40-6-60-18-73-38l-6 33-23-31-26 33-22-35-19 35-8-40c-17 21-36 33-73 43 19-30 29-60 31-95-7-25-13-48-10-68z" fill="url(#hair)"/>
    <path d="M132 190c4-65 38-101 87-105 48-4 84 27 92 82-22-20-48-30-79-28-42 3-70 20-100 51z" fill="#5d3528" opacity=".48"/>
    <path d="M140 222c-2 36 2 66 13 92-11 17-17 37-18 61-22-50-22-106 5-153z" fill="#170c09" opacity=".5"/>

