    <path d="M142 207c-10-4-17 5-16 17 1 12 7 21 17 21 5 0 8-2 10-5l-1-27z" fill="url(#skin)"/>
    <path d="M279 207c10-4 17 5 16 17-1 12-7 21-17 21-5 0-8-2-10-5l1-27z" fill="url(#skin)"/>
    <circle cx="134" cy="259" r="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="288" cy="259" r="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="134" cy="272" r="3.4" fill="#f1d99a"/>
    <circle cx="288" cy="272" r="3.4" fill="#f1d99a"/>

    <!-- brows and eyes -->
    <path d="M166 190c9-7 21-8 31-3" fill="none" stroke="#3d231b" stroke-width="5" stroke-linecap="round"/>
    <path d="M230 187c10-5 22-4 31 3" fill="none" stroke="#3d231b" stroke-width="5" stroke-linecap="round"/>
    <path d="M164 209c8-8 20-8 28 0-7 9-20 9-28 0z" fill="#fbf6ea"/>
    <path d="M232 209c8-8 20-8 28 0-7 9-20 9-28 0z" fill="#fbf6ea"/>
    <circle cx="178" cy="209" r="5.8" fill="#4a2a1a"/>
    <circle cx="246" cy="209" r="5.8" fill="#4a2a1a"/>
    <circle cx="178" cy="209" r="2.6" fill="#140b07"/>
    <circle cx="246" cy="209" r="2.6" fill="#140b07"/>
    <circle cx="180.5" cy="206.6" r="1.7" fill="#fff8e8"/>
    <circle cx="248.5" cy="206.6" r="1.7" fill="#fff8e8"/>
    <path d="M160 204c9-7 22-8 33-3" fill="none" stroke="#2a1711" stroke-width="2" stroke-linecap="round"/>
    <path d="M230 201c11-5 23-4 32 3" fill="none" stroke="#2a1711" stroke-width="2" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M212 214c-2 14-5 26-9 34 4 4 9 5 14 2" fill="none" stroke="#8e5338" stroke-width="3.4" stroke-linecap="round" opacity=".62"/>
    <path d="M199 250c6 3 12 3 18 0" fill="none" stroke="#9c5f42" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>

    <!-- lips -->
    <path d="M187 274c8-4 14-6 23-6 9 0 17 2 23 6-6 12-13 18-23 18s-17-6-23-18z" fill="url(#lips)"/>
    <path d="M190 276c8 2 15 2 22 1 7 1 13 1 20-1" fill="none" stroke="#5e2430" stroke-width="1.4" opacity=".6"/>
    <path d="M197 270c5-3 10-4 14-3" fill="none" stroke="#d78b86" stroke-width="2" stroke-linecap="round" opacity=".5"/>

    <!-- hair over the forehead and shoulders -->
    <path d="M144 181c17-32 45-47 74-45 32 2 55 18 72 47-20-12-38-17-57-16-24 1-46 6-67 21z" fill="url(#hair)"/>
    <path d="M150 174c-5 34-3 63 6 87-10 27-13 58-9 92-20-47-21-105 3-179z" fill="#3d2118" opacity=".8"/>
    <path d="M281 176c8 26 11 53 8 79 10 27 12 55 7 84 19-41 19-93-15-163z" fill="#26140f" opacity=".7"/>
    <path d="M153 184c26-12 49-17 71-16" fill="none" stroke="#7a4935" stroke-width="5" stroke-linecap="round" opacity=".35"/>
    <path d="M276 185c-8-9-18-14-28-17" fill="none" stroke="#8a553d" stroke-width="4" stroke-linecap="round" opacity=".28"/>

    <!-- blazer and blouse -->
    <path d="M171 375c-31 10-74 32-101 72l-28 73h118l44-83 8-54z" fill="url(#emerald)"/>
    <path d="M249 375c31 10 74 32 101 72l28 73H260l-44-83-8-54z" fill="url(#emerald)"/>
    <path d="M210 383l-22 38 22 36 22-36z" fill="#f2e6cf"/>
    <path d="M210 383l-22 38 22 36-13-34z" fill="#d8c7a8" opacity=".65"/>
    <path d="M188 421l-17 27-21-73c17-10 33-17 48-21l-6 34z" fill="url(#emeraldLight)"/>
    <path d="M232 421l17 27 21-73c-17-10-33-17-48-21l6 34z" fill="#0c3b2d"/>
    <path d="M188 421l22 36-6 63h-41z" fill="#093a2b" opacity=".65"/>
    <path d="M232 421l-22 36 6 63h41z" fill="#062a21" opacity=".6"/>
    <path d="M151 387c-17 9-33 21-48 34" fill="none" stroke="#2d8a69" stroke-width="2" opacity=".28"/>
    <path d="M269 387c17 9 33 21 48 34" fill="none" stroke="#041f18" stroke-width="2" opacity=".35"/>

    <!-- necklace -->
    <path d="M185 365c8 19 16 27 25 27s18-8 25-27" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M210 391l7 9-7 9-7-9z" fill="url(#gold)"/>
    <path d="M210 398l3 4-3 4-3-4z" fill="#1f6d53"/>

    <!-- a quiet table-light rim -->
    <path d="M131 203c6-51 35-85 80-88 43-3 74 25 85 70" fill="none" stroke="#f1d99a" stroke-width="2" opacity=".18" filter="url(#glow)"/>
    <path d="M18 520c8-93 64-145 148-165" fill="none" stroke="#f1d99a" stroke-width="1.4" opacity=".14"/>
    <path d="M402 520c-8-92-64-145-148-165" fill="none" stroke="#f1d99a" stroke-width="1.4" opacity=".14"/>
